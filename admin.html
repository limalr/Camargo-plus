<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BLACK STRIVE — Administração</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #070709;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at 70% 20%, #6f32b844, transparent 35%),
        #070709;
    }

    .login-box {
      width: min(430px, 100%);
      background: #111114;
      border: 1px solid #332a3d;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 25px 80px #000;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 25px;
    }

    .logo span {
      color: #914ce8;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #92909a;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: bold;
      color: #c8c4cf;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #39323f;
      border-radius: 10px;
      background: #09090b;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #914ce8;
    }

    .login-button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #7c3bd1;
      color: white;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-button:hover {
      background: #914ce8;
    }

    .login-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.5;
    }

    .error {
      background: #3a1518;
      border: 1px solid #733238;
      color: #ff9ca3;
    }

    .success {
      background: #12301e;
      border: 1px solid #285d39;
      color: #9be4b0;
    }

    .admin-screen {
      min-height: 100vh;
    }

    header {
      height: 72px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0c0c0f;
      border-bottom: 1px solid #29242f;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 9px 16px;
      border: 1px solid #3b3542;
      border-radius: 9px;
      background: #17151a;
      color: white;
      cursor: pointer;
    }

    .content {
      width: min(1200px, 92%);
      margin: auto;
      padding: 40px 0;
    }

    .welcome h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #8d8994;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 30px;
    }

    .card {
      background: #111114;
      border: 1px solid #29242f;
      border-radius: 17px;
      padding: 23px;
    }

    .card-title {
      color: #aaa5b0;
    }

    .card-number {
      display: block;
      margin-top: 12px;
      color: #a35cf0;
      font-size: 32px;
      font-weight: 900;
    }

    .panel {
      margin-top: 30px;
      padding: 25px;
      background: #111114;
      border: 1px solid #29242f;
      border-radius: 17px;
    }

    .panel h2 {
      margin-top: 0;
    }

    .status {
      padding: 13px;
      border-radius: 9px;
      background: #19171d;
      color: #aaa5b0;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <!-- ==============================
       LOGIN
  =============================== -->

  <section id="loginScreen" class="login-screen">

    <div class="login-box">

      <div class="logo">
        BLACK <span>STRIVE</span>
      </div>

      <h1>
        Painel Administrativo
      </h1>

      <div class="subtitle">
        Entre com sua conta de administrador.
      </div>

      <form id="loginForm">

        <label for="email">
          E-mail
        </label>

        <input
          id="email"
          type="email"
          placeholder="Digite seu e-mail"
          autocomplete="email"
          required
        >

        <label for="password">
          Senha
        </label>

        <input
          id="password"
          type="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        >

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          ENTRAR
        </button>

      </form>

      <div
        id="loginMessage"
        class="message hidden"
      ></div>

    </div>

  </section>


  <!-- ==============================
       PAINEL
  =============================== -->

  <section
    id="adminScreen"
    class="admin-screen hidden"
  >

    <header>

      <div class="logo">
        BLACK <span>STRIVE</span>
      </div>

      <button
        id="logoutButton"
        class="logout"
      >
        SAIR
      </button>

    </header>


    <main class="content">

      <div class="welcome">

        <h1>
          Painel Administrativo
        </h1>

        <p>
          Bem-vindo ao painel da BLACK STRIVE.
        </p>

      </div>


      <div class="cards">

        <div class="card">
          <div class="card-title">
            📦 Produtos
          </div>

          <span
            id="productsCount"
            class="card-number"
          >
            0
          </span>
        </div>


        <div class="card">
          <div class="card-title">
            🛒 Pedidos
          </div>

          <span
            id="ordersCount"
            class="card-number"
          >
            0
          </span>
        </div>


        <div class="card">
          <div class="card-title">
            💬 Mensagens
          </div>

          <span
            id="messagesCount"
            class="card-number"
          >
            0
          </span>
        </div>


        <div class="card">
          <div class="card-title">
            🏆 Campeonatos
          </div>

          <span
            id="championshipsCount"
            class="card-number"
          >
            0
          </span>
        </div>

      </div>


      <div class="panel">

        <h2>
          Status do sistema
        </h2>

        <div
          id="systemStatus"
          class="status"
        >
          Verificando conexão...
        </div>

      </div>

    </main>

  </section>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
    ==================================================
    CONFIGURAÇÃO DO SUPABASE
    ==================================================

    MANTENHA A SUA URL E A SUA CHAVE PÚBLICA
    QUE VOCÊ JÁ COLOCOU AQUI ANTERIORMENTE.

    NÃO COLOQUE SERVICE_ROLE OU SECRET KEY.
    ==================================================
    */

    const SUPABASE_URL =
      "https://iykwmwnajhqoglxfimip.supabase.co/rest/v1/";


    const SUPABASE_ANON_KEY =
      "sb_publishable__aaB-_qBO4wAvuYRwUuetA_IYNPxFFO";


    /*
    ==================================================
    CRIAR CLIENTE
    ==================================================
    */

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /*
    ==================================================
    ELEMENTOS
    ==================================================
    */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminScreen =
      document.getElementById("adminScreen");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutButton =
      document.getElementById("logoutButton");


    /*
    ==================================================
    MENSAGEM
    ==================================================
    */

    function showLoginMessage(text, type) {

      loginMessage.textContent = text;

      loginMessage.className =
        "message " + type;

    }


    function clearLoginMessage() {

      loginMessage.textContent = "";

      loginMessage.className =
        "message hidden";

    }


    /*
    ==================================================
    MOSTRAR ADMIN
    ==================================================
    */

    function showAdmin() {

      loginScreen.classList.add("hidden");

      adminScreen.classList.remove("hidden");

      loadDashboard();

    }


    /*
    ==================================================
    MOSTRAR LOGIN
    ==================================================
    */

    function showLogin() {

      adminScreen.classList.add("hidden");

      loginScreen.classList.remove("hidden");

    }


    /*
    ==================================================
    LOGIN
    ==================================================
    */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearLoginMessage();

        loginButton.disabled = true;

        loginButton.textContent =
          "ENTRANDO...";


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        try {

          const result =
            await supabaseClient.auth.signInWithPassword({

              email: email,

              password: password

            });


          if (result.error) {

            console.error(
              "Erro de login:",
              result.error
            );


            /*
              MOSTRA O ERRO REAL DO SUPABASE.
              Isso é importante para descobrirmos
              o que está acontecendo.
            */

            showLoginMessage(
              "Erro: " + result.error.message,
              "error"
            );

            return;

          }


          if (!result.data.session) {

            showLoginMessage(
              "O login foi processado, mas nenhuma sessão foi criada.",
              "error"
            );

            return;

          }


          showAdmin();


        } catch (error) {

          console.error(error);

          showLoginMessage(
            "Erro de conexão: " + error.message,
            "error"
          );

        } finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "ENTRAR";

        }

      }
    );


    /*
    ==================================================
    SAIR
    ==================================================
    */

    logoutButton.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        showLogin();

      }
    );


    /*
    ==================================================
    DASHBOARD
    ==================================================
    */

    async function loadDashboard() {

      const systemStatus =
        document.getElementById("systemStatus");


      systemStatus.textContent =
        "🔄 Carregando informações...";


      try {

        const products =
          await supabaseClient
            .from("products")
            .select("*", {
              count: "exact",
              head: true
            });


        const orders =
          await supabaseClient
            .from("orders")
            .select("*", {
              count: "exact",
              head: true
            });


        const messages =
          await supabaseClient
            .from("messages")
            .select("*", {
              count: "exact",
              head: true
            });


        const championships =
          await supabaseClient
            .from("championships")
            .select("*", {
              count: "exact",
              head: true
            });


        if (products.error) {
          throw products.error;
        }

        if (orders.error) {
          throw orders.error;
        }

        if (messages.error) {
          throw messages.error;
        }

        if (championships.error) {
          throw championships.error;
        }


        document
          .getElementById("productsCount")
          .textContent =
          products.count || 0;


        document
          .getElementById("ordersCount")
          .textContent =
          orders.count || 0;


        document
          .getElementById("messagesCount")
          .textContent =
          messages.count || 0;


        document
          .getElementById("championshipsCount")
          .textContent =
          championships.count || 0;


        systemStatus.textContent =
          "🟢 Conectado ao Supabase.";

      } catch (error) {

        console.error(
          "Erro ao carregar painel:",
          error
        );


        systemStatus.textContent =
          "⚠️ Login realizado, mas houve um erro ao carregar os dados: " +
          error.message;

      }

    }


    /*
    ==================================================
    VERIFICAR SESSÃO EXISTENTE
    ==================================================
    */

    async function checkSession() {

      try {

        const result =
          await supabaseClient.auth.getSession();


        if (
          result.data &&
          result.data.session
        ) {

          showAdmin();

        } else {

          showLogin();

        }

      } catch (error) {

        console.error(
          "Erro ao verificar sessão:",
          error
        );

        showLogin();

      }

    }


    /*
    ==================================================
    INICIAR
    ==================================================
    */

    checkSession();


    /*
    ==================================================
    OBSERVAR LOGIN/LOGOUT
    ==================================================
    */

    supabaseClient.auth.onAuthStateChange(
      function(event, session) {

        if (
          event === "SIGNED_IN" &&
          session
        ) {

          showAdmin();

        }

        if (
          event === "SIGNED_OUT"
        ) {

          showLogin();

        }

      }
    );

  </script>

</body>

</html>
